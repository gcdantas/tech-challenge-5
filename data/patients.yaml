# Pacientes SINTÉTICOS da demonstração técnica (responsável: I4).
#
# Os dados de cada paciente vêm de fontes distintas (vídeos dos datasets
# públicos REHAB24-6 e Charades, PhysioNet, notas escritas pela equipe) e foram
# associados apenas para a demonstração técnica. Nenhum paciente aqui é uma
# pessoa real internada. Vídeos: python -m data.download_rehab24 e
# python -m data.download_charades.
#
# Alinhamento temporal (plano v5, correção 7):
#   instante_demo = demo_reference + demo_offset + tempo_interno_da_mídia
# demo_offset em segundos (pode ser negativo, ex.: nota do dia anterior).
# Cada módulo soma o demo_offset do próprio artefato antes de gravar
# timestamp_start / timestamp_end (e o timestamp do movement.parquet).
#
# kind: video_physio | video_bed | audio | note | vitals | prescriptions
# path: caminho relativo à raiz do repositório; null = ainda não definido.
# Versão provisória feita pelo I1 para destravar o M1; formato a confirmar com o I4.

demo_reference: "2026-11-03T10:00:00-03:00"

patients:
  P001:
    description: >-
      Paciente sintético P001, cujos dados vêm de fontes distintas associadas
      só para a demonstração técnica.
    artifacts:
      video_fisio:
        kind: video_physio
        # REHAB24-6, agachamento (pessoa 6), câmera 18; 110 s
        path: data/video/rehab24-6/PM_105-Camera18-30fps-transposed.mp4
        demo_offset: 0          # 10:00:00
      video_leito:
        kind: video_bed
        # Charades SSP8C: deitada na cama, levanta-se por volta de 18 s; 30 s
        path: data/video/charades/SSP8C.mp4
        demo_offset: 600        # 10:10:00
      consulta:
        kind: audio
        path: data/audio/P001_consulta.wav
        demo_offset: 1800       # 10:30:00
      nota_anterior:
        kind: note
        path: data/notes/P001_nota_1.txt
        demo_offset: -86400     # 02/11 10:00 (dia anterior)
      nota_recente:
        kind: note
        path: data/notes/P001_nota_2.txt
        demo_offset: 2400       # 10:40:00
      vitais:
        kind: vitals
        path: null              # registro do PhysioNet: a definir pelo I3
        demo_offset: 0
      prescricoes:
        kind: prescriptions
        path: null              # fonte das prescrições: a definir pelo I3 (critério do M1)
        demo_offset: 0

# Fusão tardia (dono: I4). Código em app/fusion.py; e-mail em config/alerts.yaml.
#
# Cada modalidade já chega como Findings. Por paciente, em três etapas:
#   1. regras explícitas (rules), com precedência;
#   2. combinação ponderada dos scores (weighted) nos Findings que sobraram;
#   3. o que ainda sobrar vira alerta isolado pela severidade.

window_minutes: 30
# Deduplicação: um alerta do mesmo tipo (a regra, "ponderado" ou
# isolado:<fonte>:<tipo>) não sai de novo para o mesmo paciente dentro do
# cooldown; os Findings novos entram em suppressed_finding_ids do alerta
# anterior. Se o nível subir (ex.: atenção -> urgente), o alerta sai mesmo assim.
cooldown_minutes: 30

# Termos que contam como "termo respiratório" (comparados com evidence.term,
# sem diferenciar maiúsculas; basta conter um deles).
respiratory_terms:
  - falta de ar
  - dispneia
  - dispnéia
  - sem ar
  - ofegante

# Findings que não entram em nenhuma regra viram alerta isolado por severidade.
severity_to_level:
  low: atencao
  medium: atencao
  high: urgente
  critical: critico

# Cada condição é uma lista de alternativas (basta uma). A regra dispara quando
# todas as condições têm um Finding dentro da mesma janela.
rules:
  - name: respiratorio_vocal_spo2
    level: critico
    description: >-
      Indicador vocal alterado + termo respiratório na consulta ou na nota de
      evolução + queda de SpO2 na mesma janela de 30 min
    conditions:
      - - {source: audio, type: indicador_vocal_alterado}
      - - {source: audio, type: termo_critico, respiratory_term: true}
        - {source: text, type: termo_critico, respiratory_term: true}
      - - {source: vitals, type: dessaturacao}

# Combinação ponderada dos scores. HEURÍSTICA DE PRIORIZAÇÃO do protótipo, não
# probabilidade clínica calibrada; as regras acima têm precedência.
#
# Findings de fontes diferentes que começam na mesma janela (window_minutes a
# partir do primeiro) viram um único alerta "ponderado", com
#   score = soma(peso_fonte * maior score da fonte) / soma(pesos das fontes presentes)
# O nível é o maior entre o do score (thresholds) e o da severidade de cada
# Finding: a combinação pode subir o nível, nunca rebaixar.
weighted:
  enabled: true
  # Peso relativo de cada fonte (confiabilidade do sinal no protótipo). Fonte
  # sem peso aqui não entra na combinação e só gera alerta isolado.
  source_weights:
    vitals: 1.0         # medida fisiológica objetiva
    prescription: 0.9   # erro de prescrição verificável no registro
    movement: 0.8       # saída do leito, derivada do vídeo
    text: 0.7           # termo crítico na nota de evolução
    audio: 0.6          # termo na fala e indicador vocal EXPERIMENTAL
    video: 0.6          # desvio na fisioterapia
  # Mínimo de fontes diferentes para combinar (uma fonte só não é corroboração).
  min_sources: 2
  # Score mínimo de cada nível. Sem "critico": só regra explícita ou Finding
  # de severidade critical geram alerta crítico (e e-mail).
  thresholds:
    atencao: 0.3
    urgente: 0.75
